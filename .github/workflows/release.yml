name: Release

# A pushed v* tag builds the release binary on both first-class platforms
# (CONTEXT.md) and attaches both archives to a GitHub Release for that tag.
on:
  push:
    tags: ["v*"]

# The fan-in job creates the release with `gh` using the built-in token.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spelled once: the build jobs package these names and the fan-in job
  # attaches them, so a rename cannot drift between the two.
  MACOS_INSTALLER: ferrite-${{ github.ref_name }}-aarch64-apple-darwin.dmg
  WINDOWS_INSTALLER: ferrite-${{ github.ref_name }}-x86_64-pc-windows-msvc-setup.exe

jobs:
  macos:
    name: macOS arm64 (Metal)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require release-signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ferrite-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ferrite-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "No Developer ID Application identity in certificate" >&2; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build signed disk image
        run: scripts/install-app.sh --dmg "$MACOS_INSTALLER"
      - name: Notarize and staple disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          xcrun notarytool submit "$MACOS_INSTALLER" --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$MACOS_INSTALLER"
          xcrun stapler validate "$MACOS_INSTALLER"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$MACOS_INSTALLER"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ferrite-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ferrite-signing.p12" "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.MACOS_INSTALLER }}
          if-no-files-found: error

  windows:
    name: Windows x64 (DirectX 11)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Committed wire fixtures are parsed byte-for-byte; keep checkout literal.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require release-signing credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw "Missing required secret: WINDOWS_CERTIFICATE" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "Missing required secret: WINDOWS_CERTIFICATE_PASSWORD" }
      - name: Import Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "ferrite-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if (-not $certificate) { throw "The PFX does not contain a certificate with a private key" }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build signed Windows installer
        shell: pwsh
        run: scripts/package-windows.ps1 -OutputFile "$env:WINDOWS_INSTALLER" -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}"
      - name: Remove signing credentials
        if: always()
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.certificate.outputs.thumbprint }}"
          if ($thumbprint) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "ferrite-signing.pfx") -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.WINDOWS_INSTALLER }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Fan-in: exactly one job touches the release, so the builds cannot race
    # each other creating it.
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          assets=("$MACOS_INSTALLER" "$WINDOWS_INSTALLER")
          # Checked first, so a create failure stays a create failure — an
          # unconditional fallback would bury a 5xx or token error under
          # upload's "release not found".
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run, or a hand-made release for the tag: attach onto it.
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" --verify-tag --generate-notes "${assets[@]}"
          fi

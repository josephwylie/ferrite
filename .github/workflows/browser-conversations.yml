name: Conversation browser boundary
on:
  push:
    branches: ['feat/browser-193']
  workflow_dispatch:
concurrency:
  group: browser-conversations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: Verify Codex visual transport ordering
        run: |
          for attempt in $(seq 1 50); do
            cargo test -p ferrite-core --locked --test visuals --quiet
          done
      - run: cargo test -p ferrite-core --locked --test wrap_up
      - run: cargo test -p ferrite-core --locked --lib server::tests::browser_providers

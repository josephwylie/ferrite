name: Browser annotation editor
on:
  push:
    branches: ['feat/browser-195-editor']
  workflow_dispatch:
concurrency:
  group: browser-annotation-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: macos-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: compiler-cache
        continue-on-error: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Continue without the optional compiler cache
        if: steps.compiler-cache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - run: cargo test -p ferrite-pane --locked --lib annotation_editor

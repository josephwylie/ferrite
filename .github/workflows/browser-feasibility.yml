name: Packaged browser feasibility

# Keep the feasibility evidence independent of unrelated core test failures.
on:
  pull_request:
    paths:
      - 'scripts/*agent-browser*'
      - 'scripts/native_browser_service.py'
      - 'scripts/probe-embedded-browser.py'
      - 'scripts/patches/agent-browser*'
      - 'scripts/test_package_agent_browser.py'
      - '.github/workflows/browser-feasibility.yml'
      - 'crates/ferrite*/**'
      - 'scripts/*windows.ps1'
      - 'scripts/install-app.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-cef:
    name: Packaged CEF sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      FERRITE_BROWSER_SMOKE: '1'
      FERRITE_BROWSER_SMOKE_DRIVER: ${{ github.workspace }}/scripts/probe-embedded-browser.py
      FERRITE_BROWSER_EVIDENCE: ${{ github.workspace }}/target/browser-evidence
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - name: Windows packaged engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEF_PATH = Join-Path $HOME '.local\share\cef'
          cargo build -p ferrite --locked --features cef
          if ($LASTEXITCODE -ne 0) { throw 'CEF build failed' }
          scripts/stage-windows.ps1 -BuildDirectory target/debug -Destination target/debug/bundle/windows/Ferrite
          python scripts/package-agent-browser.py --destination target/debug/bundle/windows/Ferrite
          if ($LASTEXITCODE -ne 0) { throw 'Native controller packaging failed' }
          target/debug/ferrite.exe --visual-smoke
          if ($LASTEXITCODE -eq 0) { throw 'Naked executable bypassed the sandbox bootstrap' }
          target/debug/bundle/windows/Ferrite/ferrite.exe --visual-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CEF smoke failed' }
          $env:FERRITE_BROWSER_UNSAFE_SMOKE = '1'
          foreach ($unsafeSwitch in @('--no-sandbox', '--no-sandbox=0', '/NO-SANDBOX=0')) {
            target/debug/bundle/windows/Ferrite/ferrite.exe --visual-smoke $unsafeSwitch
            if ($LASTEXITCODE -ne 0) { throw "Unsafe configuration did not preserve sealed-only behavior: $unsafeSwitch" }
          }
      - name: macOS packaged engine
        if: runner.os == 'macOS'
        run: |
          scripts/install-app.sh --bundle-only
          target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite --visual-smoke
          for unsafe_switch in --no-sandbox --no-sandbox=0 -no-sandbox=0; do
            FERRITE_BROWSER_UNSAFE_SMOKE=1 target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite --visual-smoke "$unsafe_switch"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-browser-${{ runner.os }}-${{ runner.arch }}
          path: target/browser-evidence
          if-no-files-found: ignore

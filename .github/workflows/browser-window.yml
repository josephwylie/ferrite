name: Packaged browser window

# Keep the feasibility evidence independent of unrelated core test failures.
# Match the primary CI's compiler caching for the vendored GPUI stack.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'

on:
  push:
    branches: [feat/browser-196]
  pull_request:
    paths:
      - 'scripts/*agent-browser*'
      - 'scripts/native_browser_service.py'
      - 'scripts/browser_processes.py'
      - 'scripts/browser_resources.py'
      - 'scripts/browser-window-*.py'
      - 'scripts/bench/browser-controllers/**'
      - 'scripts/probe-embedded-browser.py'
      - 'scripts/patches/agent-browser*'
      - 'scripts/test_package_agent_browser.py'
      - '.github/workflows/browser-window.yml'
      - 'scripts/probe-browser-window.py'
      - 'crates/ferrite*/**'
      - 'scripts/*windows.ps1'
      - 'scripts/install-app.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-cef:
    name: Production Cockpit window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      FERRITE_BROWSER_EVIDENCE: ${{ github.workspace }}/target/browser-window-evidence
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Continue without optional compiler cache when unavailable
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-cef
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - name: Build Windows CEF application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEF_PATH = Join-Path $HOME '.local\share\cef'
          cargo build -p ferrite --locked --features browser-smoke
          if ($LASTEXITCODE -ne 0) { throw 'CEF build failed' }
      - name: Build macOS CEF application
        if: runner.os == 'macOS'
        run: |
          CEF_PATH="$HOME/.local/share/cef" cargo build --profile local -p ferrite --locked --features browser-smoke
          cargo build --profile local --locked -p herdr-projects --bin ferrite-projects
      - name: Identify native compiler
        id: native-rust
        shell: bash
        run: |
          rustc -vV > "$RUNNER_TEMP/browser-window-rust-version"
          digest=$(python -c "import hashlib,os,pathlib; print(hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP']) / 'browser-window-rust-version').read_bytes()).hexdigest())")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore exact native controller stage
        id: native-stage
        uses: actions/cache/restore@v4
        with:
          path: target/browser-controller
          key: browser-native-stage-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-rust.outputs.digest }}-${{ hashFiles('scripts/package-agent-browser.py', 'scripts/patches/agent-browser-0.41.2-ferrite.patch') }}
      - name: Discard incomplete cached native source
        if: steps.native-stage.outputs.cache-hit != 'true'
        run: python -c "import shutil; shutil.rmtree('target/agent-browser-build', ignore_errors=True)"
      - name: Build native controller
        if: steps.native-stage.outputs.cache-hit != 'true'
        run: python scripts/package-agent-browser.py --destination target/browser-controller
      - name: Verify exact native controller stage
        run: python scripts/package-agent-browser.py --destination target/browser-controller --offline
      # Save before the feature probe: a truthful red result must not force a
      # rebuild of this unchanged, independently verified native binary.
      - name: Cache verified native controller stage
        if: steps.native-stage.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/browser-controller
          key: ${{ steps.native-stage.outputs.cache-primary-key }}
      - name: Stage Windows package
        id: package-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/stage-windows.ps1 -BuildDirectory target/debug -Destination target/debug/bundle/windows/Ferrite
          python scripts/package-agent-browser.py --destination target/debug/bundle/windows/Ferrite --from-stage target/browser-controller
          if ($LASTEXITCODE -ne 0) { throw 'Native controller staging failed' }
      - name: Stage and sign macOS bundle
        id: package-mac
        if: runner.os == 'macOS'
        env:
          FERRITE_BROWSER_CONTROLLER_STAGE: ${{ github.workspace }}/target/browser-controller
          FERRITE_BUILD_FEATURES: browser-smoke
        run: scripts/install-app.sh --bundle-only
      - name: Reset this run's isolated evidence directory
        shell: bash
        run: python -c "import os,pathlib,shutil; p=pathlib.Path(os.environ['FERRITE_BROWSER_EVIDENCE']); shutil.rmtree(p,ignore_errors=True); p.mkdir(parents=True)"
      - name: Existing packaged Engine/View isolation, pixels and native select popup
        if: always() && !cancelled() && (steps.package-windows.outcome == 'success' || steps.package-mac.outcome == 'success')
        shell: bash
        env:
          FERRITE_BROWSER_SMOKE_DRIVER: ${{ github.workspace }}/scripts/probe-embedded-browser.py
          FERRITE_BROWSER_EVIDENCE: ${{ github.workspace }}/target/browser-window-evidence/engine
          FERRITE_BROWSER_PROFILE: ${{ runner.temp }}/ferrite-final-engine-profile
          FERRITE_STORE: ${{ runner.temp }}/ferrite-final-engine-store
          FERRITE_PROJECTS_BIN: ${{ runner.temp }}/nonexistent-ferrite-projects
          FERRITE_BROWSER_SMOKE_MOCK_KEYCHAIN: '1'
          TERM: dumb
        run: |
          executable="${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }}"
          python -c "import subprocess,sys; subprocess.run([sys.argv[1],'--visual-smoke'],check=True,timeout=240)" "$executable"
      - name: Probe Windows production window
        id: window-windows
        if: always() && !cancelled() && runner.os == 'Windows' && steps.package-windows.outcome == 'success'
        run: python scripts/probe-browser-window.py target/debug/bundle/windows/Ferrite/ferrite.exe --compare-executable target/debug/ferrite.exe --output target/browser-window-evidence
      - name: Probe macOS production window
        id: window-mac
        if: always() && !cancelled() && runner.os == 'macOS' && steps.package-mac.outcome == 'success'
        run: python scripts/probe-browser-window.py target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite --output target/browser-window-evidence
      - name: Observe displayed fixture through actual Claude adapter
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider claude --output target/browser-window-evidence/claude
      - name: Operate the displayed fixture through a fresh actual Codex Thread
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider codex --output target/browser-window-evidence/codex
      - name: Complete one work order through the claude adapter
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider claude --work-orders --tasks 1 --output target/browser-window-evidence/work-orders/claude
      - name: Complete one work order through the codex adapter
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider codex --work-orders --tasks 1 --output target/browser-window-evidence/work-orders/codex
      - name: Actual claude annotation capture, drawing, batch delivery and restarted history
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider claude --annotations --output target/browser-window-evidence/annotations-claude
      - name: Actual codex annotation capture, drawing, batch delivery and restarted history
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider codex --annotations --output target/browser-window-evidence/annotations-codex
      - name: Actual claude manual, stale, concurrent and uncertain-write boundaries
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider claude --boundaries --output target/browser-window-evidence/boundaries-claude
      - name: Actual codex manual, stale, concurrent and uncertain-write boundaries
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider codex --boundaries --output target/browser-window-evidence/boundaries-codex
      - name: First provider screenshot during a held operator gesture
        if: always() && !cancelled() && (steps.window-windows.outcome == 'success' || steps.window-mac.outcome == 'success')
        run: |
          python scripts/probe-browser-window.py ${{ runner.os == 'Windows' && 'target/debug/bundle/windows/Ferrite/ferrite.exe' || 'target/local/bundle/macos/Ferrite.app/Contents/MacOS/ferrite' }} --provider claude --held-screenshot --output target/browser-window-evidence/held-screenshot
      - name: Diagnose Windows naked native startup after a packaged failure
        if: failure() && runner.os == 'Windows'
        run: python scripts/probe-browser-window.py target/debug/ferrite.exe --startup-only --output target/browser-window-evidence/naked-startup-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-window-${{ runner.os }}-${{ runner.arch }}
          path: target/browser-window-evidence
          if-no-files-found: warn

  focused-regressions:
    name: Focused browser, provider and GPUI regressions
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Keep compiler cache optional
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"; fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-focused
          cache-on-failure: true
      - name: Compile the focused packages once
        id: focused-build
        run: cargo test -p ferrite-core -p ferrite-pane -p ferrite-cockpit --locked --features ferrite-core/test-support --no-run
      - name: Public browser, ownership, unknown-wire and annotation service regressions
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-core --locked --features test-support browser
      - name: Actual provider serialization regressions
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-core --locked --features test-support --test visuals --test claude_session --test codex_session
      - name: Native view input and full viewport regressions
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-pane --locked --lib visual::element::tests
      - name: All annotation editor controls
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-pane --locked --lib annotation_editor
      - name: Actual Cockpit annotation and browser host regressions
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-cockpit --locked --lib browser
      - name: Existing preview shell regression boundary
        if: always() && steps.focused-build.outcome == 'success'
        run: cargo test -p ferrite-cockpit --locked --lib cockpit::tests::panel_preview

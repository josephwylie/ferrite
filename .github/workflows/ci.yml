name: CI

# Each run checks what its change can affect (scripts/ci_scope.py): a PR
# against its base, a push to main against the newest commit whose run here
# succeeded. Windows runs on main and on a PR labelled `full-ci`. The
# nightly run and `full-ci` check everything. A change no check here reads
# skips the platform checks after architecture and selector validation.
# Caches are saved from main only, which every PR reads.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 4 * * *'

concurrency:
  # A newer push to a PR replaces its run. Main's runs finish, so each saves
  # the caches PRs read; a newer push replaces only one still waiting, and
  # checks its change too. The nightly run has its own group, so no push
  # replaces it.
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI exercises debug assertions but does not need debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # rust-cache excludes our vendored path dependencies. Cache compiler output
  # too, so their dependants (the GPUI stack) need not compile on every PR.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  scope:
    runs-on: ubuntu-latest
    # It reads which of main's runs succeeded.
    permissions:
      actions: read
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      checks: ${{ steps.scope.outputs.checks }}
      windows: ${{ steps.scope.outputs.windows }}
      packages: ${{ steps.scope.outputs.packages }}
      vendored: ${{ steps.scope.outputs.vendored }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verification selection
        run: |
          python -m unittest discover -s scripts -p test_ci_scope.py
          python -m unittest discover -s scripts -p test_check_raw_presses.py
      - name: Test the CI guards
        working-directory: scripts
        env:
          # The crate-graph tests run cargo tree, which asks rustc for its
          # version through the wrapper; this job installs no sccache.
          RUSTC_WRAPPER: ''
        run: python -m unittest test_check_tangle test_check_crate_graph test_junit_summary test_quarantine
      - id: scope
        name: Check architecture and select verification
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          FORCED: ${{ github.event.forced }}
          GH_TOKEN: ${{ github.token }}
        # A push to main checks everything since the newest commit whose run
        # here succeeded, so the change of a run that was cancelled or failed
        # is checked again. ci_scope.py checks everything when there is no
        # such commit HEAD descends from, as after a first push. A forced
        # push, the nightly run and any other event check everything.
        run: |
          case "$EVENT" in
            pull_request) args=(--base "$BASE"); if [ "$FULL_LABEL" = true ]; then args+=(--full); fi ;;
            push)
              mapfile -t checked < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=50" \
                --jq '.workflow_runs[] | select(.event == "push" or .event == "schedule") | .head_sha' | grep -xE '[0-9a-f]{40}')
              if [ "${#checked[@]}" = 0 ]; then echo '::warning::No successful run on main found; checking everything.'; fi
              if [ "$FORCED" = true ]; then args=(--full); else args=(--checked "${checked[@]}" --windows); fi ;;
            *) args=(--full) ;;
          esac
          python scripts/ci_scope.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  # The macOS work is three jobs that run at once, so it takes as long as the
  # longest one. Each compiles on its own runner, and rust-cache keys each
  # job's cache by its job id, so no job overwrites another's. Each runs only
  # when the scope job succeeded and selected it.
  macos-tests:
    name: macOS tests
    needs: scope
    if: ${{ needs.scope.outputs.packages != '' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # Default features exercise the synthetic engine. The CEF builds are
      # checked below; browser-window.yml runs the packaged engine.
      - name: Test affected workspace packages (synthetic engine)
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          quarantined=$(python3 scripts/quarantine.py)
          # A handful of tests fail about one run in two on a loaded runner.
          # A test that passes on a retry is listed as flaky and does not
          # fail the job; one that fails three times does.
          cargo nextest run "${args[@]}" --profile ci -E "not ($quarantined)" --locked --no-fail-fast --retries 2 --status-level all --final-status-level flaky
      - name: Test the quarantined tests, which never fail the job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          # With no -p, nextest would build the default members.
          if [ -z "$PACKAGES" ]; then echo 'No package selected.'; exit 0; fi
          quarantined=$(python3 scripts/quarantine.py)
          if [ "$quarantined" = 'none()' ]; then echo 'No test is quarantined.'; exit 0; fi
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo nextest run "${args[@]}" --profile quarantine -E "$quarantined" --locked --no-fail-fast --no-tests=pass
      # A test program's temporary files live in /tmp/ferrite-tests/<pid>,
      # removed as it exits (crates/ferrite-core/src/test_temp.rs). One here
      # was written outside it: a test program without that file.
      - name: Tests leave nothing in the temporary folder
        run: |
          left=$(ls -d "$TMPDIR"/ferrite-* /tmp/ferrite-* 2>/dev/null | grep -vx /tmp/ferrite-tests || true)
          if [ -n "$left" ]; then echo "$left"; exit 1; fi
      # The failed, flaky and slowest tests, in the run's summary. Each run
      # attempt keeps its own reports, so a rerun does not replace the first.
      - name: Summarize the test reports
        if: ${{ !cancelled() }}
        run: python3 scripts/junit_summary.py target/nextest/*/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos-tests-${{ github.run_attempt }}
          path: target/nextest/*/junit.xml

  # Its own run: gpui-pre-macos's tests need its test-support feature named
  # for them. The app's tests get it through the headless platform. Only
  # vendored code and what builds it select it (ci_scope.py).
  macos-vendored:
    name: macOS vendored tests
    needs: scope
    if: ${{ needs.scope.outputs.vendored != '' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Test vendored framework crates
        env:
          VENDORED: ${{ needs.scope.outputs.vendored }}
        run: |
          args=()
          for package in $VENDORED; do args+=(-p "$package"); done
          quarantined=$(python3 scripts/quarantine.py)
          cargo nextest run "${args[@]}" --features gpui-pre-macos/test-support --profile ci -E "not ($quarantined)" --locked --no-fail-fast --retries 2 --final-status-level flaky
      - name: Test the quarantined tests, which never fail the job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VENDORED: ${{ needs.scope.outputs.vendored }}
        run: |
          quarantined=$(python3 scripts/quarantine.py)
          if [ "$quarantined" = 'none()' ]; then echo 'No test is quarantined.'; exit 0; fi
          args=()
          for package in $VENDORED; do args+=(-p "$package"); done
          cargo nextest run "${args[@]}" --features gpui-pre-macos/test-support --profile quarantine -E "$quarantined" --locked --no-fail-fast --no-tests=pass
      - name: Summarize the test reports
        if: ${{ !cancelled() }}
        run: python3 scripts/junit_summary.py target/nextest/*/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos-vendored-${{ github.run_attempt }}
          path: target/nextest/*/junit.xml

  macos-checks:
    name: macOS checks
    needs: scope
    if: ${{ needs.scope.outputs.checks == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build app
        run: cargo build -p ferrite --locked
      # Nothing else builds the scene fixtures behind this feature, so a
      # change to what they call broke them unseen.
      - name: Check the visual-reference build
        run: cargo check -p ferrite --locked --features visual-reference
      # Nothing else on most PRs compiles the code behind these features: the
      # packaged browser run starts only for Browser changes (ci_scope.py).
      # The CEF download is the slow part of the check, and Cargo.lock pins it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check the CEF builds
        env:
          CEF_PATH: ${{ runner.temp }}/cef
        run: |
          cargo check -p ferrite --locked --features cef
          cargo check -p ferrite --locked --features browser-smoke
      # After the builds, so a new raw press does not hide their results. The cap
      # keeps the vendored crates' own deny attributes from stopping clippy;
      # bash's pipefail fails the step if clippy errors (docs/adr/0044).
      - name: Hold feature code's raw presses to the baseline
        shell: bash
        run: |
          cargo clippy --locked -p ferrite -p ferrite-cockpit -p ferrite-frame -p ferrite-pane -p ferrite-review -p ferrite-factory -p ferrite-terminal \
            --message-format=json -- --cap-lints warn -A clippy::all -W clippy::disallowed_methods \
            | python3 scripts/check_raw_presses.py
      # The untangling's guards take seconds and build nothing, so they report
      # whatever the steps above did.
      - name: Hold the root view's tangle to the baseline
        if: ${{ !cancelled() }}
        run: python3 scripts/check_tangle.py
      - name: Keep feature crates off the shell on Cargo's resolved graph
        if: ${{ !cancelled() }}
        run: python3 scripts/check_crate_graph.py

  # The required check for the macOS jobs. A skipped required check passes,
  # so this one also runs after the scope job or a job it needs failed or
  # timed out, and fails then. It is skipped only when the scope job
  # succeeded and selected nothing, and cancelling the run cancels it.
  macos:
    name: macOS (Metal)
    needs: [scope, macos-tests, macos-vendored, macos-checks]
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected macOS jobs
        env:
          SCOPE: ${{ needs.scope.result }}
          PACKAGES: ${{ needs.scope.outputs.packages }}
          CHECKS: ${{ needs.scope.outputs.checks }}
          VENDORED: ${{ needs.scope.outputs.vendored }}
          TESTS_RESULT: ${{ needs.macos-tests.result }}
          CHECKS_RESULT: ${{ needs.macos-checks.result }}
          VENDORED_RESULT: ${{ needs.macos-vendored.result }}
        run: |
          test "$SCOPE" = success
          # A selected job must succeed, and one not selected must be skipped.
          require() {
            if [ -n "$2" ] && [ "$2" != false ]; then
              test "$3" = success
            else
              test "$3" = skipped
              echo "$1: not selected, intentionally skipped."
            fi
          }
          require 'macOS tests' "$PACKAGES" "$TESTS_RESULT"
          require 'macOS checks' "$CHECKS" "$CHECKS_RESULT"
          require 'Vendored tests' "$VENDORED" "$VENDORED_RESULT"

  windows:
    name: Windows (DirectX 11)
    needs: scope
    if: ${{ needs.scope.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Committed wire fixtures are parsed byte-for-byte; keep checkout literal.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The runner's C: drive is slow for Cargo's many small files. Build on
      # a ReFS Dev Drive instead: the workspace (and so target/), Cargo's
      # registry and the toolchain all live there, so every step below runs
      # from DEV_DRIVE_WORKSPACE.
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - uses: dtolnay/rust-toolchain@stable
      # Cargo 1.100's build-dir layout gives a big crate's rustc command more
      # than Windows' 32,767 characters, so Cargo passes it as an @argfile.
      # sccache 0.17 to 0.19 expand that file and spawn rustc with the full
      # command, which Windows rejects (os error 206); 0.16 passes it through.
      # Unpin once sccache spawns long commands via an argfile
      # (mozilla/sccache#2787).
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped so main saves a cache that holds the CEF builds' output.
          prefix-key: v1-rust
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # A change to the staging scripts alone selects no package.
      - name: Test affected workspace packages (synthetic engine)
        if: needs.scope.outputs.packages != ''
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          quarantined=$(python scripts/quarantine.py)
          # Retries as on macOS above: this runner fails a different
          # timing-dependent test on most runs.
          cargo nextest run "${args[@]}" --profile ci -E "not ($quarantined)" --locked --no-fail-fast --retries 2 --status-level all --final-status-level flaky
      # Like the tests above, these need a package: with no -p, nextest
      # would build the default members.
      - name: Test the quarantined tests, which never fail the job
        if: ${{ !cancelled() && needs.scope.outputs.packages != '' }}
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          quarantined=$(python scripts/quarantine.py)
          if [ "$quarantined" = 'none()' ]; then echo 'No test is quarantined.'; exit 0; fi
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo nextest run "${args[@]}" --profile quarantine -E "$quarantined" --locked --no-fail-fast --no-tests=pass
      - name: Summarize the test reports
        if: ${{ !cancelled() && needs.scope.outputs.packages != '' }}
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: python scripts/junit_summary.py target/nextest/*/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test reports
        if: ${{ !cancelled() && needs.scope.outputs.packages != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows-${{ github.run_attempt }}
          path: ${{ env.DEV_DRIVE_WORKSPACE }}/target/nextest/*/junit.xml
      - name: Build app
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo build -p ferrite --locked
      # The Windows half of the CEF code, as on macOS above.
      # The CEF download is the slow part of the check, and Cargo.lock pins it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check the CEF build
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          CEF_PATH: ${{ runner.temp }}/cef
        run: cargo check -p ferrite --locked --features cef
      - name: Windows staging contract
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/tests/windows-stage.ps1

  verification:
    name: Verification decisions
    needs: [scope, macos, windows]
    # A run replaced by a newer one (a PR opened with its labels starts two)
    # reports nothing rather than a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks and explain intentional skips
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          WINDOWS_SELECTED: ${{ needs.scope.outputs.windows }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$SCOPE" = success
          if [ "$CODE" = false ]; then
            test "$MACOS" = skipped
            test "$WINDOWS" = skipped
            echo 'Nothing a check here reads changed. Platform checks intentionally skipped.'
          else
            test "$MACOS" = success
            if [ "$WINDOWS_SELECTED" = true ]; then
              test "$WINDOWS" = success
            else
              test "$WINDOWS" = skipped
              echo 'Windows intentionally deferred to main or a full-ci PR, or nothing it checks changed.'
            fi
          fi

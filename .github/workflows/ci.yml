name: CI

# A PR runs the macOS checks only, and nothing when it changes docs alone.
# Windows runs on main and on a PR labelled `full-ci`. The app with visuals
# (Chromium) is built by the release workflow only. A skipped job counts as
# passed for branch protection. Caches are saved from main only, which every
# PR reads.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR replaces its run; main's runs all finish, so each
  # one saves the caches PRs read.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI exercises debug assertions but does not need debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # rust-cache excludes our vendored path dependencies. Cache compiler output
  # too, so their dependants (the GPUI stack) need not compile on every PR.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # What the run covers: `code` is false for a PR that changes only docs
  # (Markdown, docs/); `reviewr` is true when the vendored review core or
  # the lockfile changes; `full` is true on main and for a `full-ci` PR.
  # A scope that fails to say runs everything (`!= 'false'` below), so a
  # broken scope never skips a check.
  scope:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      reviewr: ${{ steps.scope.outputs.reviewr }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reviewr=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qE '^crates/ferrite-reviewr/|^Cargo\.lock$'; then
            echo "reviewr=true" >> "$GITHUB_OUTPUT"
          else
            echo "reviewr=false" >> "$GITHUB_OUTPUT"
          fi
          echo "full=$FULL_LABEL" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (Metal)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # nextest prints each test's time; neither crate has doctests.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test core
        run: cargo nextest run -p ferrite-core --locked --no-fail-fast
      - name: Test the vendored review core
        if: needs.scope.outputs.reviewr != 'false'
        run: cargo nextest run -p ferrite-reviewr --locked --no-fail-fast
      - name: Build app
        run: cargo build -p ferrite --locked

  windows:
    name: Windows (DirectX 11)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' && needs.scope.outputs.full != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Committed wire fixtures are parsed byte-for-byte; keep checkout literal.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The runner's C: drive is slow for Cargo's many small files. Build on
      # a ReFS Dev Drive instead: the workspace (and so target/), Cargo's
      # registry and the toolchain all live there, so every step below runs
      # from DEV_DRIVE_WORKSPACE.
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - uses: dtolnay/rust-toolchain@stable
      # Cargo 1.100's build-dir layout gives a big crate's rustc command more
      # than Windows' 32,767 characters, so Cargo passes it as an @argfile.
      # sccache 0.17 to 0.19 expand that file and spawn rustc with the full
      # command, which Windows rejects (os error 206); 0.16 passes it through.
      # Unpin once sccache spawns long commands via an argfile
      # (mozilla/sccache#2787).
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Probe gh (temporary)
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP gh-probe
          git init -q -b main $repo
          Set-Location $repo
          git -c user.email=t@example.invalid -c user.name=t commit -q --allow-empty -m base
          foreach ($i in 1..3) { "gh pr view ${i}: " + (Measure-Command { gh pr view --json number 2>&1 | Out-Null }).TotalMilliseconds }
          foreach ($i in 1..3) { "gh --version ${i}: " + (Measure-Command { gh --version | Out-Null }).TotalMilliseconds }
          foreach ($i in 1..3) { "git remote ${i}: " + (Measure-Command { git remote -v | Out-Null }).TotalMilliseconds }
          (Get-Command gh).Source
          $said = gh pr view --json number 2>&1 | Select-Object -First 1
          "gh pr view exit ${LASTEXITCODE}: $said"
          $loop = {
            param($repo, $log)
            Set-Location $repo
            while ($true) {
              $s = Get-Date
              gh pr view --json number 2>&1 | Out-Null
              "{0:HH:mm:ss} {1}" -f $s, ((Get-Date) - $s).TotalMilliseconds | Add-Content $log
              Start-Sleep -Seconds 5
            }
          }
          $log = Join-Path $env:RUNNER_TEMP gh-probe.log
          $cmd = "& {$loop} '$repo' '$log'"
          Start-Process pwsh -ArgumentList '-NoProfile', '-Command', $cmd -WindowStyle Hidden
      - name: Test core
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo nextest run -p ferrite-core --locked --no-fail-fast
      - name: Print gh probe under load (temporary)
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP gh-probe.log)
      - name: Test the vendored review core
        if: needs.scope.outputs.reviewr != 'false'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo nextest run -p ferrite-reviewr --locked --no-fail-fast
      - name: Build app
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo build -p ferrite --locked
      - name: Windows staging contract
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/tests/windows-stage.ps1
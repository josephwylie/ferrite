name: CI

# Validate each PR once; main builds also seed caches for subsequent PRs.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI exercises debug assertions but does not need debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # rust-cache excludes our vendored path dependencies. Cache compiler output
  # too, so their dependants (the GPUI stack) need not compile on every PR.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  macos:
    name: macOS (Metal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test -p ferrite-core --locked
      - name: Test the vendored review core
        run: cargo test -p ferrite-reviewr --locked
      # Projects (vendored herdr-projects) is Unix-only, so macOS alone.
      - name: Test Projects 1.0
        run: cargo test -p sw-core -p sw-flow -p sw-board -p herdr-projects --locked
      - name: Build app
        run: cargo build -p ferrite --locked
      # The Chromium adapter is shared with Windows: keep it compiling here.
      # (Running it needs the .app bundle; see visual/smoke.rs.)
      - name: CEF version
        id: cef
        run: echo "version=$(sed -n '/^name = "cef"$/{n;s/^version = ".*+\(.*\)"$/\1/p;}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - name: Install CEF build tools
        run: brew install cmake ninja
      - name: Build app with visuals
        run: CEF_PATH="$HOME/.local/share/cef" cargo build -p ferrite --locked --features cef

  windows:
    name: Windows (DirectX 11)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Committed wire fixtures are parsed byte-for-byte; keep checkout literal.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test -p ferrite-core --locked -- --nocapture
      - name: Test the vendored review core
        run: cargo test -p ferrite-reviewr --locked
      - name: Build app
        run: cargo build -p ferrite --locked
      # Visuals (ADR 0013): the app with Chromium, and proof that Chromium
      # runs from it on Windows: `ferrite --visual-smoke` boots the engine
      # headless, opens a page and checks its frames' pixels, its content
      # height and a hover (crates/ferrite/src/visual/smoke.rs). CEF is a
      # ~170 MB download, cached by its version in Cargo.lock; the runner
      # has cmake, and ninja is installed for CEF's C++ wrapper. The runner
      # has no GPU: Chromium falls back to software on its own.
      - name: CEF version
        id: cef
        shell: bash
        run: echo "version=$(sed -n '/^name = "cef"$/{n;s/^version = ".*+\(.*\)"$/\1/p;}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - name: Install ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - name: Build app with visuals
        shell: pwsh
        run: |
          $env:CEF_PATH = Join-Path $HOME ".local\share\cef"
          cargo build -p ferrite --locked --features cef
      - name: Visuals smoke
        shell: pwsh
        timeout-minutes: 5
        run: |
          scripts/copy-chromium-windows.ps1 -Destination target\debug
          target\debug\ferrite.exe --visual-smoke

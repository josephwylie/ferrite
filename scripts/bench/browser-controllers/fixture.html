<!doctype html><html><head><title>Work orders</title><style>body{font:16px system-ui;margin:0;background:#f3f4f6;color:#172235}nav{background:#172235;padding:18px;color:white;position:sticky;top:0}button,input,select,textarea{font:inherit;padding:10px;margin:5px}button{cursor:pointer}main{max-width:850px;margin:24px auto;padding:24px;background:white}label{display:block;margin:16px 0}input,textarea{display:block;width:90%}input[type=checkbox]{display:inline;width:auto}.spacer{height:350px;background:#f9fafb;padding:20px}#status{padding:12px;background:#e4eefc}article{padding:12px;border-bottom:1px solid #ddd}textarea{height:60px}</style></head><body><nav>Operations workspace <button id="records">Work orders</button><button id="home">Overview</button></nav><main id="app"></main><script>
let records=[],current=null;const app=document.querySelector('#app');const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function list(){app.innerHTML='<p role="status">Loading orders…</p>';records=await(await fetch('/api/records')).json();app.innerHTML='<h1>Work orders</h1><button id="create">Create order</button><label>Search orders<input id="search"></label><div id="results"></div>';document.querySelector('#create').onclick=()=>form();document.querySelector('#search').oninput=()=>render();render()}
function render(){const q=document.querySelector('#search').value;document.querySelector('#results').innerHTML=records.filter(r=>r.name.includes(q)).map(r=>`<article><strong>${r.name}</strong><p>${r.team} · ${r.priority}</p><button data-id="${r.id}">Open order</button></article>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>form(records.find(r=>r.id===b.dataset.id)))}
async function form(record){current=record||null;app.innerHTML='<p>Preparing editor…</p>';await wait(180);app.innerHTML=`<h1>${record?'Edit':'Create'} work order</h1><form id="form"><label>Name<input id="name" required></label><label>Owner email<input id="email" type="email" required></label><label>Description<textarea id="description" required></textarea></label><label>Team<select id="team"><option>Engineering</option><option>Design</option><option>Support</option></select></label><label>Priority<select id="priority"><option>Low</option><option>Normal</option><option>High</option></select></label><label><input id="notify" type="checkbox">Notify owner</label><div class="spacer">Additional metadata is below the fold.<p>Changes are validated and saved to the local service.</p></div><button id="add-field" type="button">Add custom field</button><div id="custom"></div><label>Budget<input id="budget" type="number" min="1" required></label><label><input id="approved" type="checkbox" required>Approve this order</label><button id="save">Save order</button><button id="cancel" type="button">Cancel</button><p id="status" role="status">Unsaved changes</p></form>`;
const add=()=>{document.querySelector('#custom').innerHTML='<label>Custom field name<input id="custom-name" required></label><label>Custom field value<input id="custom-value" required></label>';document.querySelector('#add-field').disabled=true};document.querySelector('#add-field').onclick=async()=>{await wait(150);add()};document.querySelector('#cancel').onclick=list;
if(record){for(const k of ['name','email','description','team','priority','budget'])document.getElementById(k).value=record[k];for(const k of ['notify','approved'])document.getElementById(k).checked=record[k];add();document.querySelector('#custom-name').value=record.customName;document.querySelector('#custom-value').value=record.customValue}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const data={id:current?.id};for(const k of ['name','email','description','team','priority','budget'])data[k]=document.getElementById(k).value;for(const k of ['notify','approved'])data[k]=document.getElementById(k).checked;data.customName=document.querySelector('#custom-name')?.value;data.customValue=document.querySelector('#custom-value')?.value;document.querySelector('#save').disabled=true;document.querySelector('#status').textContent='Saving…';const saved=await(await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})).json();current=saved;document.querySelector('#save').disabled=false;document.querySelector('#status').textContent='Saved '+saved.id};}
document.querySelector('#records').onclick=list;document.querySelector('#home').onclick=()=>app.innerHTML='<h1>Overview</h1><p>Manage orders through the Work orders tab.</p>';app.innerHTML='<h1>Overview</h1><p>Manage orders through the Work orders tab.</p>';
</script></body></html>

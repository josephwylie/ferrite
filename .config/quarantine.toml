# Tests that fail too often to block a merge.
#
# CI runs these apart from the rest, in a step that reports them and never
# fails the job (ci.yml). Each entry is a debt: fix the test or the product,
# then delete the entry. An entry names the test as nextest lists it, why it
# is here, and who owns the fix:
#
#     [[test]]
#     name = "cockpit::tests::machines::everywhere::every_row_and_palette_verb_reaches_its_threads_machine"
#     reason = "waits out doorbell::until's 120 s bound on a loaded runner"
#     owner = "<GitHub login>"
#
# scripts/tangle.json counts the entries, so quarantining a test raises it.

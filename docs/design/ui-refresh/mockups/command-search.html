<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Static export of a design canvas board. Open it in a browser at its own size. -->
<title>Ferrite · Command search</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#161616}
a{color:inherit;text-decoration:none}a:hover{color:#f2f2f2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
</style>

<div style="width: 800px; height: 560px; box-sizing: border-box; padding: 56px 80px; display: flex; justify-content: center; align-items: flex-start; background: #161616; color: #d0d0d0; font-family: Geist, -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased; white-space: nowrap; font-feature-settings: 'tnum' 1">
<div role="dialog" aria-label="Command search" style="width: 640px; display: flex; flex-direction: column; background: #222222; border-radius: 12px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 64px rgba(0,0,0,.55); overflow: hidden">

<label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.06)">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search threads or run a command</span>
<input value="supp" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-size: 14.5px; color: #f2f2f2">
<span style="font-size: 12px; color: #8c8c8c">esc</span>
</label>

<div style="display: flex; flex-direction: column; padding: 6px 6px 8px">
<div style="height: 28px; display: flex; align-items: flex-end; padding: 0 10px 4px; font-size: 12px; font-weight: 500; color: #8c8c8c">Threads</div>
<button aria-current="true" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; background: #2e2e2e; color: #f2f2f2"><span aria-hidden="true" style="width: 14px; text-align: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8cd398">⠹</span><span style="flex: 1; color: #a0a0a0"><span style="color: #f2f2f2; font-weight: 600">Supp</span><span style="color: #f2f2f2">lier Price Review</span></span><span style="font-size: 12px; color: #8c8c8c">agenticos · Work</span><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10 4 15l5 5"></path><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg></button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg><span style="flex: 1">Complete BB <span style="color: #f2f2f2; font-weight: 600">supp</span>lier list</span><span style="font-size: 12px; color: #8c8c8c">agenticos · Work</span><span style="width: 13px"></span></button>

<div style="height: 32px; display: flex; align-items: flex-end; padding: 0 10px 4px; font-size: 12px; font-weight: 500; color: #8c8c8c">Commands</div>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg><span style="flex: 1">New thread in agenticos</span><span style="font-size: 12px; color: #8c8c8c">⌘N</span></button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.75" stroke-linecap="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg><span style="flex: 1">New thread in a worktree</span><span style="font-size: 12px; color: #8c8c8c">⌘⇧N</span></button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M12 3v18M3 12h18"></path></svg><span style="flex: 1">Open Work</span><span style="font-size: 12px; color: #8c8c8c">⌘2</span></button>

</div>

<div style="display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; color: #8c8c8c">
<span>↑↓ select · ⏎ open · ⇥ preview in a pane · esc</span><span style="flex: 1"></span><span>5 results</span>
</div>
</div>
</div>


</body>
</html>

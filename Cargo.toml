[workspace]
resolver = "2"
members = [
    "crates/ferrite-core",
    "crates/ferrite",
    "crates/ferrite-ui",
    "crates/ferrite-pane",
    "crates/ferrite-cockpit",
    "crates/ferrite-terminal",
    "crates/ferrite-frame",
    "crates/ferrite-focus-notify",
    "crates/ferrite-reviewr",
]
# Spikes build standalone with their own lockfiles; panes24 is the pinned
# perf fixture and must not churn with workspace dependency updates.
exclude = [
    "spikes/panes24",
    "vendor/gpui-base",
    "vendor/gpui-pre",
    "vendor/gpui-pre-macos",
    "vendor/taffy",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a JSON object's keys as written (fixtures, the
# API's answers); float_roundtrip reads a written time back exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
libc = "0.2"

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
taffy = { path = "vendor/taffy" }

[profile.release]
lto = "thin"

# Local installs (scripts/install-app.sh but for --dmg): release speed without
# the cross-crate ThinLTO pass, which took most of a rebuild.
[profile.local]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# Optimise dependencies (the GPUI stack) in dev and test builds: built once,
# they halve the test suites' run time. Workspace crates stay unoptimised,
# so an edit rebuilds as fast as before.
[profile.dev.package."*"]
opt-level = 2

# Line tables only in dev and test builds: backtraces keep file and line,
# and each build keeps roughly half the debug info on disk.
[profile.dev]
debug = "line-tables-only"

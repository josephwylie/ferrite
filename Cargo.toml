[workspace]
resolver = "2"
members = [
    "crates/ferrite-core",
    "crates/ferrite-engine",
    "crates/ferrite-client",
    "crates/ferrite-server",
    "crates/ferrite",
    "crates/ferrite-ui",
    "crates/ferrite-pane",
    "crates/ferrite-cockpit",
    "crates/ferrite-review",
    "crates/ferrite-factory",
    "crates/ferrite-tools",
    "crates/ferrite-nav",
    "crates/ferrite-settings",
    "crates/ferrite-terminal",
    "crates/ferrite-frame",
    "crates/ferrite-focus-notify",
    "crates/ferrite-reviewr",
    # Members so their tests can resolve dev-dependencies and run in CI
    # against the patched tree; default-members keeps them out of plain builds.
    "vendor/gpui-base",
    "vendor/gpui-component",
    "vendor/gpui-pre",
    "vendor/gpui-pre-macos",
    "vendor/gpui-pre-platform",
    "vendor/gpui-pre-windows",
    "vendor/taffy",
]
default-members = ["crates/*"]
# Spikes build standalone with their own lockfiles; panes24 is the pinned
# perf fixture and must not churn with workspace dependency updates.
exclude = ["spikes/panes24"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a JSON object's keys as written (fixtures, the
# API's answers); float_roundtrip reads a written time back exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
libc = "0.2"

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-platform = { path = "vendor/gpui-pre-platform" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
taffy = { path = "vendor/taffy" }

[profile.release]
lto = "thin"

# Local installs (scripts/install-app.sh but for --dmg): release speed without
# the cross-crate ThinLTO pass, which took most of a rebuild.
[profile.local]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# Optimise dependencies (the GPUI stack) in dev and test builds: built once,
# they halve the test suites' run time. Workspace crates stay unoptimised,
# so an edit rebuilds as fast as before. No debug info for them: backtraces
# into dependencies rarely matter, and a clean build is 21% smaller and 13%
# faster (#248). Build scripts' dependencies then match, so they build once.
[profile.dev.package."*"]
opt-level = 2
debug = false

# "*" skips workspace members, so the vendored members are listed by name.
[profile.dev.package.gpui-base]
opt-level = 2
debug = false

[profile.dev.package.gpui-component]
opt-level = 2
debug = false

[profile.dev.package.gpui-pre]
opt-level = 2
debug = false

[profile.dev.package.gpui-pre-macos]
opt-level = 2
debug = false

[profile.dev.package.gpui-pre-platform]
opt-level = 2
debug = false

[profile.dev.package.gpui-pre-windows]
opt-level = 2
debug = false

[profile.dev.package.taffy]
opt-level = 2
debug = false

# Line tables only in dev and test builds: backtraces keep file and line,
# and each build keeps roughly half the debug info on disk.
[profile.dev]
debug = "line-tables-only"

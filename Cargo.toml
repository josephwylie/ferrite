[workspace]
resolver = "2"
members = [
    "crates/ferrite-core",
    "crates/ferrite",
    "crates/ferrite-projects",
    "crates/ferrite-projects-core",
    "crates/ferrite-projects-flow",
    "crates/ferrite-projects-board",
    "crates/ferrite-focus-notify",
    "crates/ferrite-reviewr",
]
# Spikes build standalone with their own lockfiles; panes24 is the pinned
# perf fixture and must not churn with workspace dependency updates.
exclude = [
    "spikes/panes24",
    "vendor/gpui-base",
    "vendor/gpui-pre",
    "vendor/gpui-pre-macos",
    "vendor/taffy",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order and float_roundtrip are herdr-projects' (ADR 0031): a closing
# note's time read back is the time written.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# herdr-projects 1.0's crates (ADR 0031) and what they take from upstream's
# workspace, as upstream declares them.
sw-core = { path = "crates/ferrite-projects-core" }
sw-flow = { path = "crates/ferrite-projects-flow" }
sw-board = { path = "crates/ferrite-projects-board" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
regex = "1"
fancy-regex = "0.14"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1_smol = "1"
yaml-rust2 = { version = "0.10", default-features = false }

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
taffy = { path = "vendor/taffy" }

[profile.release]
lto = "thin"

# Local installs (scripts/install-app.sh but for --dmg): release speed without
# the cross-crate ThinLTO pass, which took most of a rebuild.
[profile.local]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# Optimise dependencies (the GPUI stack) in dev and test builds: built once,
# they halve the test suites' run time. Workspace crates stay unoptimised,
# so an edit rebuilds as fast as before.
[profile.dev.package."*"]
opt-level = 2

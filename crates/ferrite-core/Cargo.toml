[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's shared side: the protocol and the types a window and a Server both hold. No UI."

[features]
# What other crates' tests drive core with: the doorbell's rings, a
# finished sign-in, and the keys a test makes with no Cockpit behind it.
test-support = []

[dependencies]
# herdr-reviewr's review core, vendored: the Review slot's git reads, search
# and PR reads, answered where the checkout is (ADR 0021).
ferrite-reviewr = { path = "../ferrite-reviewr" }
# A review's sides as the unified diff a `review_diff` answers (ADR 0021).
similar = { version = "3.2.0", features = ["text"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
chrono = "0.4.45"
# The host's time zone named where a schedule says it runs (#225).
# Already in the tree via chrono.
iana-time-zone = "0.1"
ureq = { version = "3", features = ["platform-verifier"] }
# Shared with the UI: validate website authorities, including localhost/IPv6.
url = "2"
glob = "0.3"
shlex = "1.3"
# Ferrite's own update is checked against the SHA-256 GitHub publishes
# for the installer (`self_update`). Already in the tree via gpui.
sha2 = "0.10"
# A git index's checksum, for the index a copy from Windows sends
# (`placement::Checkout`). Already in the tree via tungstenite.
sha1 = "0.10"
# The API's JSON Schema, generated from its one declaration of each
# operation (`api::schema`). Already in the tree via gpui-component.
schemars = "1"
# Canonical paths without Windows' `\\?\` verbatim prefix, which git
# rejects: project roots, worktree placement and cwd identity. Already in
# the tree via aws-lc-sys.
dunce = "1"
# A checkout's work tree walked as `git status` walks it, its ignores
# honoured, to tell with no git process whether it moved
# (`workspace::checkout_stamp`). Already in the tree via ferrite-reviewr.
ignore = "0.4.33"

# Stopping an operator's command ends its process group (`user_commands`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# An npm-installed provider CLI on Windows is a `.cmd` shim: the Session's
# child is cmd.exe with the real CLI beneath it, and only a Job Object can
# kill or meter that whole tree. Threading is for the Windows CI tests that
# prove the grandchild dies. ADR-0001 bars gpui from core, not windows-sys.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The test programs' own temporary folder (ferrite-core/src/test_temp.rs).
ctor = "1"
libc = "0.2"
serde_json = { workspace = true }

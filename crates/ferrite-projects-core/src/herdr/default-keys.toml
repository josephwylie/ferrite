# Every key herdr 0.9.3 binds by itself, from its config reference
# (github.com/herdrdev/herdr, tag v0.9.3: docs/next/website/src/data/config-reference.json). Read by rs/herdr/keys.rs:
# `herdr --default-config` prints most of these but not all (it leaves out copy_mode and the four swap_pane_* keys), so
# this list is always counted, and what the running herdr prints is laid over it. Lines are commented as herdr prints them.
[keys]
# prefix = "ctrl+b"
# help = "prefix+?"
# settings = "prefix+s"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# remote_image_paste = "ctrl+v"
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"

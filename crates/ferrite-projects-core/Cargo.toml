# The board's first crate: its data (store/), herdr and the agents, and the small tools every part uses.
# Which crate holds what, and why: docs/crates.md.
[package]
name = "sw-core"
# Ferrite: upstream's [workspace.package] values, which Ferrite's workspace does not share.
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "sw_core"

[dependencies]
chrono.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
libc.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

# Ferrite: upstream does not run clippy; this deny-by-default lint would stop
# `cargo clippy --workspace` on unchanged upstream code (store/move_home.rs).
[lints.clippy]
never_loop = "allow"

[package]
name = "ferrite-projects"
version = "0.2.34"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Ferrite's Projects: a coordinator conversation, parallel worker threads, shared memory and an overview"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.23"

[features]
# Ferrite: the window's tests build an `Env` on a scratch home too.
test-support = []

[dev-dependencies]
tempfile = "3"

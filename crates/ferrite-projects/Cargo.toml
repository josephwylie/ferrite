[package]
name = "herdr-projects"
# Ferrite: upstream's [workspace.package] values, which Ferrite's workspace does not share.
version = "1.0.1"
edition = "2024"
description = "A work board for herdr: one list of tasks, each delegated one running as an ordinary herdr agent."
license = "MIT"
publish = false
# The tests are one program (tests/main.rs, every file in tests/ a module of it), not one program per file.
autotests = false

[lib]
name = "sw"
path = "src/lib.rs"

# Ferrite: shipped with the app as `ferrite-projects` (scripts/install-app.sh).
[[bin]]
name = "ferrite-projects"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

# Ferrite: sw-board in place of sw-web (crates/web is not taken: ADR 0031).
[dependencies]
sw-board.workspace = true
regex.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
chrono.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
libc.workspace = true
ratatui.workspace = true

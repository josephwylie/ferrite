[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: native multi-provider agent cockpit (GPUI app)"

[features]
# Opt-in native framebuffer artifacts; excluded from normal application builds.
visual-reference = ["gpui/test-support", "dep:gpui-reference-platform"]
# The opaque greys on macOS too (`theme::GLASS`): what the headless parity
# captures render, since a capture cannot show the desktop blur.
opaque = []
# Agent visuals drawn by Chromium (CEF, off-screen; ADR 0013). macOS only for
# now, and only inside the app bundle `scripts/install-app.sh` builds (it
# turns this on). Off by default so a plain `cargo build` needs no cmake,
# ninja or 128 MB CEF download; without it a visual shows its title, caption
# and an open-in-browser fallback instead of the live page.
cef = ["dep:cef"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# Ferrite owns the semantic states for a few high-contrast actions instead of
# inheriting GPUI Kit's preset hover foregrounds.
gpui-base = "=0.6.0"
# The demo script builds real provider events, whose payloads are the vendors'
# own JSON. Already in the tree via ferrite-core.
serde_json = { workspace = true }
# Same platform already used by GPUI Kit; enable its framebuffer test hook only.
gpui-reference-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"], optional = true }
url = "2"
percent-encoding = "2"
# GPUI's default HTTP client refuses every request, so Markdown images with
# http(s) URLs never load. GPUI Kit already builds this client; Ferrite wires it.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.3" }
# Visuals: a rendered frame becomes a gpui RenderImage (which holds
# image::Frames), and the agent's screenshot is a PNG. Already in the tree
# via gpui.
image = { version = "0.25.1", default-features = false, features = ["png"] }
# The visual engine's wake -> cx.notify bridge (a channel a foreground task
# drains). Already in the tree via gpui.
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Chromium Embedded Framework bindings (tauri-apps/cef-rs), the `cef`
# feature's engine. Only the sandbox feature: the bundling helpers
# (`build-util`) pull in clap/cargo_metadata, and install-app.sh does that job.
cef = { version = "=154.5.0", default-features = false, features = ["sandbox"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# The smoke render needs a window; gpui's own test harness provides a headless
# one, so the app's rendering is exercised without a display.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }

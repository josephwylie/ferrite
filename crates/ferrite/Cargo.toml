[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: native multi-provider agent cockpit (GPUI app)"

# The app is the library; the binary only dispatches and launches it, so the
# tests compile the app once and the binary has none of its own.
[lib]
doctest = false

[[bin]]
name = "ferrite"
path = "src/main.rs"
test = false

[features]
# Opt-in native framebuffer artifacts; excluded from normal application builds.
# The captures are the Cockpit's (`cockpit::visual_reference`).
visual-reference = ["ferrite-cockpit/visual-reference"]
# The opaque greys on macOS too (`theme::GLASS`, in ferrite-ui).
opaque = ["ferrite-ui/opaque"]
# Agent visuals drawn by Chromium (CEF, off-screen; ADR 0013), on macOS and
# Windows. The release packaging (`scripts/install-app.sh`,
# `scripts/package-windows.ps1`) turns it on. Off by default so a plain
# `cargo build` needs no cmake, ninja or 130-170 MB CEF download; without it
# a visual shows its title, caption and an open-in-browser fallback instead
# of the live page. The engine is the Pane's (`visual`, in ferrite-pane).
cef = ["ferrite-pane/cef"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# The theme, icons, components, motion and menus the Cockpit and Pane share.
ferrite-ui = { path = "../ferrite-ui" }
# The Pane: the transcript, the Composer and the Draft.
ferrite-pane = { path = "../ferrite-pane" }
# The Cockpit the window shows: the grid, the nav and the Roster glue.
ferrite-cockpit = { path = "../ferrite-cockpit" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# GPUI's default HTTP client refuses every request, so Markdown images with
# http(s) URLs never load. GPUI Kit already builds this client; Ferrite wires it.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.3" }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# The launch's tests run in gpui's headless harness.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }

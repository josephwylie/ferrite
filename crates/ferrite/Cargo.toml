[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: native multi-provider agent cockpit (GPUI app)"

[features]
# Opt-in native framebuffer artifacts; excluded from normal application builds.
visual-reference = ["gpui/test-support", "dep:gpui-reference-platform"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# Ferrite owns the semantic states for a few high-contrast actions instead of
# inheriting GPUI Kit's preset hover foregrounds.
gpui-base = "=0.6.0"
# The demo script builds real provider events, whose payloads are the vendors'
# own JSON. Already in the tree via ferrite-core.
serde_json = { workspace = true }
# Same platform already used by GPUI Kit; enable its framebuffer test hook only.
gpui-reference-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"], optional = true }
url = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# The smoke render needs a window; gpui's own test harness provides a headless
# one, so the app's rendering is exercised without a display.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }

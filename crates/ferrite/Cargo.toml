[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: native multi-provider agent cockpit (GPUI app)"

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# Pinned published release (ADR-0001); upgrades are deliberate events.
gpui = "=0.2.2"

# Tests only: SessionEvent carries provider payloads as `Value`, so building
# one in a test needs the type. The app itself never inspects them.
[dev-dependencies]
serde_json = { workspace = true }
# The smoke render needs a window; gpui's own test harness provides a headless
# one, so the app's rendering is exercised without a display.
gpui = { version = "=0.2.2", features = ["test-support"] }

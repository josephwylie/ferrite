[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: native multi-provider agent cockpit (GPUI app)"

# The app is the library; the binary only dispatches and launches it, so the
# tests compile the app once and the binary has none of its own.
[lib]
doctest = false
# CEF's Windows sandbox bootstrap loads the application as ferrite.dll. Only
# the Windows CEF builds make it, with `cargo rustc --lib --crate-type
# cdylib` after their `cargo build` (scripts/package-windows.ps1,
# browser-window.yml, browser-feasibility.yml): as a crate type here, every
# build on every platform linked the app a second time.

[[bin]]
name = "ferrite"
path = "src/main.rs"
test = false

[features]
# `ferrite --headless` (ADR 0038): the window drawn off-screen and driven
# through the Server's `window.*` API, for an agent checking the UI.
# Excluded from release builds: it rests on gpui's test support. It builds
# the Server as the Cockpit's tests do, fixture and all, so the two share one
# build of it.
headless = ["demo", "ferrite-cockpit/headless", "ferrite-server/test-support"]
# The demo (`--demo`, `--load`, `--panes N`, `--demo parity`): scripted
# Sessions in an Engine in this process, never the operator's Server. That
# Engine is ferrite-client's fixture (ADR 0049), so release packaging, which
# turns on `cef` alone, has no demo, and refuses its flags. Development:
# `cargo run -p ferrite --features demo -- --demo`.
demo = ["ferrite-cockpit/demo"]
# Opt-in native framebuffer artifacts; excluded from normal application builds.
# The captures are the Cockpit's (`cockpit::visual_reference`).
visual-reference = ["headless", "ferrite-cockpit/visual-reference"]
# Agent visuals drawn by Chromium (CEF, off-screen; ADR 0013), on macOS and
# Windows. The release packaging (`scripts/install-app.sh`,
# `scripts/package-windows.ps1`) turns it on. Off by default so a plain
# `cargo build` needs no cmake, ninja or 130-170 MB CEF download; without it
# a visual shows its title, caption and an open-in-browser fallback instead
# of the live page. The engine is the Pane's (`visual`, in ferrite-pane).
cef = ["ferrite-pane/cef", "ferrite-cockpit/cef"]

browser-smoke = ["cef", "ferrite-cockpit/browser-smoke"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
ferrite-client = { path = "../ferrite-client" }
# The Server process `ferrite server` runs (ADR 0025).
ferrite-server = { path = "../ferrite-server" }
# The theme, icons, components, motion and menus the Cockpit and Pane share.
ferrite-ui = { path = "../ferrite-ui" }
# The Pane: the transcript, the Composer and the Draft.
ferrite-pane = { path = "../ferrite-pane" }
# The Cockpit the window shows: the grid, the nav and the Roster glue.
ferrite-cockpit = { path = "../ferrite-cockpit" }
# The window's frame around it: the titlebar, the bottom bar, Settings and
# the key table (ADR 0035).
ferrite-frame = { path = "../ferrite-frame" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# GPUI's default HTTP client refuses every request, so Markdown images with
# http(s) URLs never load. GPUI Kit already builds this client; Ferrite wires it.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.3" }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# The launch's tests drive the demo's scripted Sessions (`ferrite_cockpit::demo`).
ferrite-cockpit = { path = "../ferrite-cockpit", features = ["demo"] }
# The test programs' own temporary folder (ferrite-core/src/test_temp.rs).
ctor = "1"
libc = "0.2"
# The launch's tests run in gpui's headless harness.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }
# The type rules' render-code check (`ferrite_ui::face`).
ferrite-ui = { path = "../ferrite-ui", features = ["test-support"] }

# The flow of a task, on sw-core: delegating, the finish line, landing, the keeper, other machines.
# Which crate holds what, and why: docs/crates.md.
[package]
name = "sw-flow"
# Ferrite: upstream's [workspace.package] values, which Ferrite's workspace does not share.
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "sw_flow"

[dependencies]
sw-core.workspace = true
chrono.workspace = true
libc.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
yaml-rust2.workspace = true

[package]
name = "ferrite-focus-notify"
# Upstream's version (herdr-focus-notify), kept so a merge can tell where it is.
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Clickable macOS desktop notifications that focus the relevant Ferrite Thread (vendored herdr-focus-notify)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

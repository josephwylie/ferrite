[package]
name = "ferrite-prs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's pull requests: the PRs destination, the PR reader and the side chat, each reading the window through a Source"

[lib]
doctest = false

[features]
# The fixtures the Cockpit's own tests and its visual reference reach for:
# a PR read as if the forge answered, an action caught mid-flight.
test-support = []

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# A Thread's queue and transcript, which a PR action's hand-off follows.
ferrite-client = { path = "../ferrite-client" }
# The theme, components and menus, and the Source a view reads through.
ferrite-ui = { path = "../ferrite-ui" }
# The side chat's transcript and Composer, and a PR's prose.
ferrite-pane = { path = "../ferrite-pane" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# A PR's chosen view, kept with its Surface.
serde = { workspace = true }

[dev-dependencies]
# `ThreadKey::fixture`: a Thread with no Cockpit behind it.
ferrite-core = { path = "../ferrite-core", features = ["test-support"] }
# The tests open each view in a window of its own (`ferrite_ui::testing`).
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }
ferrite-ui = { path = "../ferrite-ui", features = ["test-support"] }
ferrite-pane = { path = "../ferrite-pane", features = ["test-support"] }
# The test programs' own temporary folder (ferrite-core/src/test_temp.rs).
ctor = "1"
libc = "0.2"

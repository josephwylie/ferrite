# herdr-reviewr's review core, vendored (README.md): its edition, its MSRV,
# its lints. Dependencies are upstream's, less the terminal UI's and herdr's.
[package]
name = "ferrite-reviewr"
version = "0.46.0"
edition = "2024"
rust-version = "1.97"
description = "herdr-reviewr's review core (git scopes, diff model, comments, search, PR reads), vendored for Ferrite's Review slot."
authors = ["Dmitry Persiyanov <dmitry.persiyanov@gmail.com>"]
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
dirs = "7"
fff-search = "0.11.0"
# The base picker's fuzzy filter (upstream's `BasePicker::filtered`).
neo_frizbee = "0.13.3"
# Already in the tree through fff-search, which walks with it. Walks a folder that appears into the
# search index.
ignore = "0.4.33"
# The forge CLIs run in a process group (unix) or job object (Windows), so ending a
# run ends its whole tree, `az.cmd`'s python included.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
serde_json = "1"
similar = { version = "3.2.0", features = ["text"] }
# Dumps + fancy-regex only: no yaml-load (we read prebuilt binary syntax dumps, so the
# unmaintained yaml-rust never enters the tree), no onig (pure-Rust regex engine).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "plist-load"] }
# The private index copy git refreshes and adds into (`git::IndexCopy`).
tempfile = "3"
# Parses RFC 3339 forge timestamps.
time = { version = "0.3", features = ["parsing"] }
two-face = "0.5.2"
# Program lookup the way a shell does it: the executable bit on unix, PATHEXT on Windows
# (so `az` finds `az.cmd`), and never the current directory for a bare name.
which = "8.0.6"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"

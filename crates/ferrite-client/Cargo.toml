[package]
name = "ferrite-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's window model: the Cockpit a window holds of its machines' Servers. No UI."

[features]
test-support = ["ferrite-core/test-support"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
ferrite-reviewr = { path = "../ferrite-reviewr" }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ferrite-core = { path = "../ferrite-core", features = ["test-support"] }
chrono = "0.4.45"
ctor = "1"
dunce = "1"
libc = "0.2"

[package]
name = "ferrite-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's Settings views and the Project card, each reading the window through a Source"

[lib]
doctest = false

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# The theme, components, fields and sheets, and the Source a view reads
# through.
ferrite-ui = { path = "../ferrite-ui" }
# The Composer a line is typed into.
ferrite-pane = { path = "../ferrite-pane" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }

[dev-dependencies]
# `ProjectKey::fixture`: a Project with no window behind it.
ferrite-core = { path = "../ferrite-core", features = ["test-support"] }
# The tests open each view in a window of its own (`ferrite_ui::testing`).
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }
ferrite-ui = { path = "../ferrite-ui", features = ["test-support"] }
# The Settings sheet as the app draws it, for the Connections page's
# tests. It is the app's frame, not a feature crate.
ferrite-frame = { path = "../ferrite-frame" }

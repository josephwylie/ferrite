[package]
name = "ferrite-cockpit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's Cockpit: the grid, the nav and the Roster glue"

[lib]
doctest = false

[features]
cef = ["ferrite-pane/cef"]
# The demo (`demo`): scripted Sessions in an Engine in this process, behind
# the app's `--demo`, `--load`, `--panes` and `--demo parity`. The Engine is
# ferrite-client's fixture (ADR 0049), so a released app has neither. The
# app's `demo` feature and `headless` turn this on.
demo = ["dep:ferrite-engine", "ferrite-client/test-support"]
# The Cockpit window drawn off-screen and driven by keys, clicks and shots
# (`headless`, ADR 0038): gpui's test support carries its input and
# capture, so release builds never have it. The app's `headless` feature
# (`ferrite --headless`) and `visual-reference` turn this on. It turns on
# what the tests below turn on too, so a headless build and the tests share
# one build of every crate (an edit to core compiles it once, not twice);
# the app's `launch` keeps the motion kit moving as on screen.
headless = [
    "demo",
    "gpui/test-support",
    "dep:gpui-reference-platform",
    "ferrite-core/test-support",
    "ferrite-engine/test-support",
    "ferrite-client/test-support",
    "ferrite-ui/test-support",
    "ferrite-pane/test-support",
    "ferrite-tools/test-support",
]
# Opt-in native framebuffer artifacts (`cockpit::visual_reference`);
# excluded from normal application builds. The app's own
# `visual-reference` feature turns this on.
visual-reference = ["headless", "ferrite-pane/visual-reference", "ferrite-review/visual-reference"]

browser-smoke = ["gpui/test-support", "dep:gpui-reference-platform", "ferrite-pane/browser-smoke"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
ferrite-client = { path = "../ferrite-client" }
# A busy Setup sync's retry, by chance (`cockpit::setup_sync`).
rand = "0.8"
# The demo's scripted Sessions and Store, and the worlds the headless
# frames and the visual reference build: never a released app's.
ferrite-engine = { path = "../ferrite-engine", optional = true }
# The theme, icons, components, motion and menus the Cockpit and Pane share.
ferrite-ui = { path = "../ferrite-ui" }
# The Pane: the transcript, the Composer and the Draft.
ferrite-pane = { path = "../ferrite-pane" }
# System notifications: herdr-focus-notify, vendored (its README).
ferrite-focus-notify = { path = "../ferrite-focus-notify" }
# The Terminal tool: the emulator and its PTY, drawn as a grid.
ferrite-terminal = { path = "../ferrite-terminal" }
# herdr-reviewr's review core, vendored: the Review slot's rows and comments
# (ADR 0021).
ferrite-reviewr = { path = "../ferrite-reviewr" }
# The Review slot's view (ADR 0021), which the cockpit reads for and lays
# beside a Pane.
ferrite-review = { path = "../ferrite-review" }
# The Factory's views (ADR 0037), which the cockpit makes over itself and
# lays out in the board's place.
ferrite-factory = { path = "../ferrite-factory" }
# The tools Surfaces (ADR 0039), which the cockpit makes over itself and
# draws in the Panel.
ferrite-tools = { path = "../ferrite-tools" }
# The nav and what stands beside it (ADR 0040), which the cockpit makes over
# itself and lays out beside the board.
ferrite-nav = { path = "../ferrite-nav" }
# The Settings views and the Project card, which the cockpit makes over
# itself and lays on its sheet.
ferrite-settings = { path = "../ferrite-settings" }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# Ferrite owns the semantic states for a few high-contrast actions instead of
# inheriting GPUI Kit's preset hover foregrounds.
gpui-base = "=0.6.0"
# The demo script builds real provider events, whose payloads are the vendors'
# own JSON. Already in the tree via ferrite-core.
serde = { workspace = true }
serde_json = { workspace = true }
# Same platform already used by GPUI Kit; enable its framebuffer test hook only.
gpui-reference-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"], optional = true }
url = "2"
# System notifications' channels. Already in the tree via gpui.
futures = "0.3"
# The nav's surface grain (`nav::list::grain`). Already in the tree via gpui.
image = { version = "0.25.1", default-features = false, features = ["png"] }
# Setup sync sees the operator's setup change. Already in the tree via gpui.
notify = "7"

[dev-dependencies]
# The test programs' own temporary folder (ferrite-core/src/test_temp.rs).
ctor = "1"
# A test's folder as the registry spells it (macOS reaches /tmp through a link).
dunce = "1"
libc = "0.2"
# The smoke render needs a window; gpui's own test harness provides a headless
# one, so the Cockpit's rendering is exercised without a display.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }
# The in-process machine the window's tests attach to.
ferrite-core = { path = "../ferrite-core", features = ["test-support"] }
ferrite-engine = { path = "../ferrite-engine", features = ["test-support"] }
ferrite-client = { path = "../ferrite-client", features = ["test-support"] }
ferrite-server = { path = "../ferrite-server", features = ["test-support"] }
ferrite-ui = { path = "../ferrite-ui", features = ["test-support"] }
ferrite-pane = { path = "../ferrite-pane", features = ["test-support"] }
ferrite-tools = { path = "../ferrite-tools", features = ["test-support"] }
# The window's frame the app installs (ADR 0035): the tests draw it too.
ferrite-frame = { path = "../ferrite-frame" }
# The platform as `headless` builds it, so the tests and a headless build
# share one build of the GPUI stack.
gpui-reference-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"] }

[[example]]
name = "changes_frames"
required-features = ["headless"]

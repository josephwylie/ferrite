[package]
name = "ferrite-cockpit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite's Cockpit: the grid, the nav and the Roster glue"

[lib]
doctest = false

[features]
# Opt-in native framebuffer artifacts (`cockpit::visual_reference`);
# excluded from normal application builds. The app's own
# `visual-reference` feature turns this on.
visual-reference = ["gpui/test-support", "dep:gpui-reference-platform", "ferrite-pane/visual-reference"]

[dependencies]
ferrite-core = { path = "../ferrite-core" }
# The theme, icons, components, motion and menus the Cockpit and Pane share.
ferrite-ui = { path = "../ferrite-ui" }
# The Pane: the transcript, the Composer and the Draft.
ferrite-pane = { path = "../ferrite-pane" }
# System notifications: herdr-focus-notify, vendored (its README).
ferrite-focus-notify = { path = "../ferrite-focus-notify" }
# herdr-reviewr's review core, vendored: the Review slot's rows and comments
# (ADR 0021).
ferrite-reviewr = { path = "../ferrite-reviewr" }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
# The kit facade keeps the renderer, native platform and components on one
# compatible stack. Keep the gpui import name for derives and existing code.
gpui = { package = "gpui-kit", version = "=0.6.0" }
# Ferrite owns the semantic states for a few high-contrast actions instead of
# inheriting GPUI Kit's preset hover foregrounds.
gpui-base = "=0.6.0"
# The demo script builds real provider events, whose payloads are the vendors'
# own JSON. Already in the tree via ferrite-core.
serde_json = { workspace = true }
# Same platform already used by GPUI Kit; enable its framebuffer test hook only.
gpui-reference-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"], optional = true }
url = "2"
# The Board runtime's and system notifications' channels. Already in the
# tree via gpui.
futures = "0.3"

# Projects 1.0 uses Unix sockets, signals and flock (ADR 0031).
# Keep its runtime out of Windows builds; the cockpit reports unavailability.
[target.'cfg(unix)'.dependencies]
sw-board = { workspace = true }

[dev-dependencies]
# The smoke render needs a window; gpui's own test harness provides a headless
# one, so the Cockpit's rendering is exercised without a display.
gpui = { package = "gpui-kit", version = "=0.6.0", features = ["test-support"] }
# The in-process machine the window's tests attach to.
ferrite-core = { path = "../ferrite-core", features = ["test-support"] }
ferrite-ui = { path = "../ferrite-ui", features = ["test-support"] }
ferrite-pane = { path = "../ferrite-pane", features = ["test-support"] }
# The image viewer's tests draw their images. Already in the tree via gpui.
image = { version = "0.25.1", default-features = false, features = ["png"] }
